<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — UniBites</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header id="site-header"></header>

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-10 w-full">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6 animate-fadeIn">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-800">Admin Dashboard</h1>
        <p class="text-slate-500 mt-1">Approve vendors, watch orders, manage users</p>
      </div>
      <span class="badge badge-confirmed">👑 admin</span>
    </div>

    <!-- tabs -->
    <div class="flex flex-wrap gap-2 mb-6 animate-slideDown">
      <button data-tab="requests" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-200">Vendor Requests</button>
      <button data-tab="orders" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-200">All Orders</button>
      <button data-tab="users" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-200">Users</button>
    </div>

    <!-- panels -->
    <section id="panel-requests" class="tab-panel"></section>
    <section id="panel-orders" class="tab-panel hidden"></section>
    <section id="panel-users" class="tab-panel hidden"></section>
  </main>

  <!-- Reject modal -->
  <div id="reject-modal" class="modal-overlay hidden">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 animate-scaleIn shadow-2xl">
      <h3 class="text-xl font-extrabold text-slate-800 mb-1">Reject application</h3>
      <p class="text-sm text-slate-500 mb-4">Provide a reason — it will be emailed to the applicant.</p>
      <input type="hidden" id="reject-id" />
      <textarea id="reject-reason" rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-red-400 focus:ring-2 focus:ring-red-200 outline-none transition-all duration-200" placeholder="e.g. Insufficient documentation…"></textarea>
      <div class="flex gap-3 mt-5">
        <button id="reject-cancel" class="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 transition-colors">Cancel</button>
        <button id="reject-confirm" class="flex-1 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white font-bold transition-colors">Reject</button>
      </div>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
