<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — Campus Bites</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50">
  <header id="site-header"></header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-10">
    <a href="restaurants.html" class="text-sm text-slate-500 hover:text-amber-600 transition-colors">&larr; All restaurants</a>

    <!-- restaurant header -->
    <div id="restaurant-header" class="mt-4 hidden bg-white rounded-3xl shadow border border-slate-100 p-6 md:p-8 animate-slideUp">
      <div class="flex flex-col md:flex-row md:items-center gap-4">
        <div id="restaurant-logo" class="w-20 h-20 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-3xl shrink-0"></div>
        <div class="flex-1">
          <h1 id="restaurant-name" class="text-2xl md:text-3xl font-extrabold text-slate-800"></h1>
          <p id="restaurant-desc" class="text-slate-500 mt-1"></p>
          <div id="restaurant-meta" class="flex flex-wrap gap-2 mt-3"></div>
        </div>
        <a href="cart.html" class="bg-amber-500 hover:bg-amber-600 hover:scale-105 text-white font-bold px-6 py-3 rounded-xl transition-all duration-200 hover:shadow-lg text-center shrink-0">
          View cart 🛒
        </a>
      </div>
    </div>

    <!-- skeleton -->
    <div id="skeleton" class="mt-6 space-y-4">
      <div class="skeleton h-24"></div><div class="skeleton h-24"></div><div class="skeleton h-24"></div>
    </div>

    <!-- menu grouped by category -->
    <div id="menu" class="mt-8 space-y-8"></div>
    <p id="empty" class="hidden text-center text-slate-400 py-16">This restaurant hasn't added any menu items yet.</p>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    CampusBites.registerPage('menu', async function () {
      const id = new URLSearchParams(window.location.search).get('id');
      const header = document.getElementById('restaurant-header');
      const skel = document.getElementById('skeleton');
      const menu = document.getElementById('menu');
      const empty = document.getElementById('empty');

      if (!id) {
        skel.classList.add('hidden');
        empty.textContent = 'No restaurant selected.';
        empty.classList.remove('hidden');
        return;
      }

      try {
        const data = await CampusBites.apiGet('/api/restaurants/' + id);
        skel.classList.add('hidden');
        header.classList.remove('hidden');

        document.title = data.restaurant.name + ' — Campus Bites';
        document.getElementById('restaurant-name').textContent = data.restaurant.name;
        document.getElementById('restaurant-desc').textContent = data.restaurant.description || '';
        document.getElementById('restaurant-logo').innerHTML = data.restaurant.logo_url
          ? `<img src="${data.restaurant.logo_url}" class="w-full h-full object-cover rounded-2xl" alt="">`
          : '🍽️';
        document.getElementById('restaurant-meta').innerHTML = [
          data.restaurant.cuisine_type ? `<span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full text-xs font-semibold">${data.restaurant.cuisine_type}</span>` : '',
          data.restaurant.address ? `<span class="text-slate-400 text-sm">📍 ${data.restaurant.address}</span>` : '',
        ].join('');

        const available = data.menu.filter((m) => m.is_available === 1 || m.is_available === true);
        if (available.length === 0) {
          empty.classList.remove('hidden');
          return;
        }

        // Group by category
        const groups = {};
        available.forEach((item) => {
          const cat = item.category || 'Other';
          (groups[cat] = groups[cat] || []).push(item);
        });

        menu.innerHTML = Object.entries(groups).map(([cat, items]) => `
          <section>
            <h2 class="text-lg font-extrabold text-slate-700 mb-4 uppercase tracking-wide">${cat}</h2>
            <div class="space-y-3">
              ${items.map((item) => `
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 flex items-center gap-4 hover:shadow-md transition-shadow duration-200">
                  ${item.images && item.images.length ? `
                    <div class="flex items-center shrink-0">
                      <img src="${item.images[0]}" class="w-16 h-16 rounded-xl object-cover border border-slate-100 shadow-sm" alt="${item.name}">
                      <div class="flex flex-col gap-1 ml-1.5">
                        ${item.images.slice(1, 3).map((src) => `<img src="${src}" class="w-8 h-8 rounded-lg object-cover border border-slate-100 hidden sm:block" alt="">`).join('')}
                        ${item.images.length > 3 ? `<span class="text-[0.6rem] font-bold text-slate-400 text-center">+${item.images.length - 3}</span>` : ''}
                      </div>
                    </div>` : ''}
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                      <h3 class="font-bold text-slate-800">${item.name}</h3>
                      ${item.is_available ? '' : '<span class="badge badge-cancelled">Unavailable</span>'}
                    </div>
                    ${item.description ? `<p class="text-sm text-slate-500 mt-0.5">${item.description}</p>` : ''}
                  </div>
                  <div class="text-right shrink-0">
                    <p class="font-extrabold text-amber-600">${CampusBites.formatMoney(item.price)}</p>
                    <button data-id="${item.id}" data-name="${item.name}" data-price="${item.price}"
                      class="add-btn mt-1 relative bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-4 py-2 rounded-lg transition-all duration-200 hover:scale-105">
                      Add to cart
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>
        `).join('');

        // Add-to-cart handlers with "+1" popup + green flash micro-interaction.
        menu.querySelectorAll('.add-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            CampusBites.cart.addToCart({
              menuItemId: Number(btn.dataset.id),
              name: btn.dataset.name,
              price: Number(btn.dataset.price),
              restaurantId: Number(id),
              restaurantName: data.restaurant.name,
            });

            // Green flash + scale on the button
            btn.classList.remove('flash');
            void btn.offsetWidth; // restart animation
            btn.classList.add('flash');

            // "+1" popup
            const pop = document.createElement('span');
            pop.className = 'add-pop';
            pop.textContent = '+1';
            btn.appendChild(pop);
            setTimeout(() => pop.remove(), 500);

            CampusBites.updateCartBadge();
            CampusBites.showToast(`${btn.dataset.name} added to cart`, 'success', 1400);
          });
        });
      } catch (err) {
        skel.classList.add('hidden');
        empty.textContent = err.message || 'Restaurant not found.';
        empty.classList.remove('hidden');
        console.error(err);
      }
    });
  </script>
</body>
</html>
