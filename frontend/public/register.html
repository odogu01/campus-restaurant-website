<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — UniBites</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header id="site-header"></header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md animate-slideUp">
      <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-6">
          <span class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-600 text-white items-center justify-center text-2xl font-black shadow mb-3">🎓</span>
          <h1 class="text-2xl font-extrabold text-slate-800">Join UniBites</h1>
          <p class="text-sm text-slate-500 mt-1">Create a student account to start ordering</p>
        </div>

        <form id="register-form" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" required placeholder="Ada Lovelace" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all duration-200" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="you@school.edu" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all duration-200" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="phone">Phone (optional)</label>
            <input id="phone" name="phone" type="tel" placeholder="080 1234 5678" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all duration-200" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="password">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" required minlength="6" placeholder="At least 6 characters" class="w-full px-4 py-3 pr-12 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all duration-200" />
              <button type="button" data-toggle-password data-target="password" aria-label="Show password"
                class="absolute right-1.5 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-amber-600 transition-colors">
                <svg data-icon-open class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg data-icon-closed class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="confirmPassword">Confirm password</label>
            <div class="relative">
              <input id="confirmPassword" name="confirmPassword" type="password" required placeholder="Repeat password" class="w-full px-4 py-3 pr-12 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all duration-200" />
              <button type="button" data-toggle-password data-target="confirmPassword" aria-label="Show password"
                class="absolute right-1.5 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-amber-600 transition-colors">
                <svg data-icon-open class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg data-icon-closed class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition-all duration-200 hover:shadow-lg">
            Create account
          </button>
        </form>

        <div class="text-center mt-6 text-sm text-slate-500">
          Already have an account?
          <a href="login.html" class="text-amber-600 font-semibold hover:text-amber-700 transition-colors">Log in</a>
        </div>
        <div class="text-center mt-2 text-xs text-slate-400">
          Want to sell food instead?
          <a href="vendor-register.html" class="text-slate-500 font-semibold hover:text-amber-600 transition-colors">Apply as a vendor</a>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
