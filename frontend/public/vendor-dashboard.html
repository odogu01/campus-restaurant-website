<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Dashboard — Campus Bites</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header id="site-header"></header>

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-10 w-full">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6 animate-fadeIn">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-800">Vendor Dashboard</h1>
        <p class="text-slate-500 mt-1">Manage your restaurant, menu and orders</p>
      </div>
      <span class="badge badge-confirmed">🍳 vendor</span>
    </div>

    <!-- tabs -->
    <div class="flex flex-wrap gap-2 mb-6 animate-slideDown">
      <button data-tab="restaurant" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-200">My Restaurant</button>
      <button data-tab="menu" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-200">Menu Items</button>
      <button data-tab="orders" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-200">Orders</button>
    </div>

    <section id="panel-restaurant" class="tab-panel"></section>
    <section id="panel-menu" class="tab-panel hidden"></section>
    <section id="panel-orders" class="tab-panel hidden"></section>
  </main>

  <!-- Restaurant edit modal -->
  <div id="rest-modal" class="modal-overlay hidden">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 animate-scaleIn shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-extrabold text-slate-800 mb-4">Edit restaurant</h3>
      <input type="hidden" id="rest-id" />
      <div class="space-y-3">
        <div><label class="block text-sm font-semibold text-slate-700 mb-1">Name</label><input id="rest-name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none" /></div>
        <div><label class="block text-sm font-semibold text-slate-700 mb-1">Description</label><textarea id="rest-desc" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none"></textarea></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">Cuisine</label><input id="rest-cuisine" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none" /></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">Phone</label><input id="rest-phone" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none" /></div>
        </div>
        <div><label class="block text-sm font-semibold text-slate-700 mb-1">Address</label><input id="rest-address" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none" /></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">Opening time</label><input id="rest-opening" type="time" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none" /></div>
          <div><label class="block text-sm font-semibold text-slate-700 mb-1">Closing time</label><input id="rest-closing" type="time" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none" /></div>
        </div>
        <div><label class="block text-sm font-semibold text-slate-700 mb-1">Logo URL (optional)</label><input id="rest-logo" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none" /></div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Restaurant photos</label>
          <input id="rest-images" type="file" accept="image/*" multiple class="w-full text-sm text-slate-600 file:mr-3 file:px-4 file:py-2 file:rounded-xl file:border-0 file:bg-amber-50 file:text-amber-700 file:font-bold hover:file:bg-amber-100 cursor-pointer" />
          <div id="rest-image-previews" class="grid grid-cols-4 gap-2 mt-2"></div>
          <p id="rest-image-count" class="text-xs text-slate-400 mt-1"></p>
        </div>
      </div>
      <div class="flex gap-3 mt-5">
        <button id="rest-cancel" class="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 transition-colors">Cancel</button>
        <button id="rest-save" class="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold transition-colors">Save</button>
      </div>
    </div>
  </div>

  <!-- Menu item modal -->
  <div id="item-modal" class="modal-overlay hidden">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 animate-scaleIn shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-extrabold text-slate-800 mb-4" id="item-modal-title">Add menu item</h3>
      <input type="hidden" id="item-id" />
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Food (item name)</label>
          <select id="item-food" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none bg-white"></select>
          <p id="item-food-hint" class="hidden text-xs text-amber-600 mt-1 font-semibold">Add foods first in My Restaurant → Foods &amp; Proteins.</p>
        </div>
        <div><label class="block text-sm font-semibold text-slate-700 mb-1">Base price (₦)</label><input id="item-price" type="number" step="0.01" min="0" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none" /></div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Proteins available with this item</label>
          <div id="item-proteins" class="space-y-1.5"></div>
          <p id="item-proteins-hint" class="hidden text-xs text-slate-400 mt-1">No proteins yet — add them in My Restaurant → Foods &amp; Proteins.</p>
        </div>
        <div><label class="block text-sm font-semibold text-slate-700 mb-1">Description</label><textarea id="item-desc" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-amber-400 outline-none"></textarea></div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Photos <span class="text-red-500">(at least 2 required)</span></label>
          <input id="item-images" type="file" accept="image/*" multiple class="w-full text-sm text-slate-600 file:mr-3 file:px-4 file:py-2 file:rounded-xl file:border-0 file:bg-amber-50 file:text-amber-700 file:font-bold hover:file:bg-amber-100 cursor-pointer" />
          <div id="item-image-previews" class="grid grid-cols-4 gap-2 mt-2"></div>
          <p id="item-image-count" class="text-xs text-slate-400 mt-1"></p>
        </div>
        <label class="flex items-center gap-2 text-sm font-semibold text-slate-700">
          <input id="item-available" type="checkbox" checked class="accent-emerald-500 w-4 h-4" /> Available for ordering
        </label>
      </div>
      <div class="flex gap-3 mt-5">
        <button id="item-cancel" class="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 transition-colors">Cancel</button>
        <button id="item-save" class="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold transition-colors">Save</button>
      </div>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/vendor.js"></script>
</body>
</html>
