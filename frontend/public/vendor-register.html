<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a vendor — Campus Bites</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header id="site-header"></header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg animate-slideUp">
      <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-6">
          <span class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-400 to-purple-600 text-white items-center justify-center text-2xl font-black shadow mb-3">🍳</span>
          <h1 class="text-2xl font-extrabold text-slate-800">Open your restaurant</h1>
          <p class="text-sm text-slate-500 mt-1">
            Apply to sell on Campus Bites. An admin will review your request and
            email you your login credentials.
          </p>
        </div>

        <form id="vendor-register-form" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="email">Contact email</label>
            <input id="email" name="email" type="email" required placeholder="owner@mykitchen.com"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all duration-200" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="restaurantName">Restaurant name</label>
            <input id="restaurantName" name="restaurantName" type="text" required placeholder="Campus Grill House"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all duration-200" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="description">What do you serve?</label>
            <textarea id="description" name="description" rows="3" placeholder="Burgers, shawarma, fried rice…"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all duration-200"></textarea>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="phone">Phone (optional)</label>
            <input id="phone" name="phone" type="tel" placeholder="080 0000 0000"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-200 outline-none transition-all duration-200" />
          </div>
          <button type="submit" class="w-full bg-violet-500 hover:bg-violet-600 text-white font-bold py-3 rounded-xl transition-all duration-200 hover:shadow-lg">
            Submit application
          </button>
        </form>

        <!-- hidden success panel -->
        <div id="success-panel" class="hidden mt-6 p-5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 animate-scaleIn">
          <p class="font-bold">🎉 Application submitted!</p>
          <p class="text-sm mt-1">We'll review your request and email your login details once approved. You can check back anytime.</p>
        </div>

        <div class="text-center mt-6 text-sm text-slate-500">
          Already approved? <a href="login.html" class="text-amber-600 font-semibold hover:text-amber-700 transition-colors">Log in to your dashboard</a>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
